# Render Blueprint for the VAERS modernization prototype.
#
# NOTE: this file has not been deployed/tested against live Render
# infrastructure — Render's Blueprint spec has changed over time, so verify
# field names (https://render.com/docs/blueprint-spec) before your first
# deploy and adjust as needed. See README.md "Deploying to Render" for the
# manual steps this assumes (first-deploy URL wiring, setting the Anthropic
# key in the dashboard).

databases:
  # "basic-256mb" (paid, cheapest current tier) — Render replaced the legacy
  # starter/standard/pro plan names; those can no longer be used for new
  # databases. Also: this account already has the one free-tier Postgres
  # slot in use elsewhere, so free isn't an option here either.
  - name: vaers-postgres
    plan: basic-256mb
    databaseName: vaers
    user: vaers

services:
  - type: web
    name: vaers-api
    runtime: node
    # Paid tier (Render's current cheapest, replacing the old "starter" name)
    # so the API never spins down on 15-minute idle — the free plan's cold
    # start (Render docs: "about one minute") was landing squarely on
    # "Start a Report", since that's usually the first API call of a visit.
    plan: 0.5c-512mb
    # On a first-time blueprint sync the database can still be provisioning
    # when this build starts, so `db push` retries for a couple of minutes
    # instead of failing on the first "can't reach database server" error.
    buildCommand: >
      npm install &&
      npx prisma generate --schema=server/prisma/schema.production.prisma &&
      bash -c 'for i in $(seq 1 24); do
        npx prisma db push --schema=server/prisma/schema.production.prisma --accept-data-loss && exit 0;
        echo "Database not reachable yet, retrying in 5s ($i/24)...";
        sleep 5;
      done; exit 1' &&
      npx tsx server/prisma/seed.ts
    startCommand: npm run start --workspace=server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vaers-postgres
          property: connectionString
      - key: DOWNLOAD_TOKEN_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CLIENT_ORIGIN
        value: "https://vaers-client.onrender.com"
      # Prototype-only shared token gating /admin — see server/src/routes/admin.ts.
      - key: ADMIN_TOKEN
        value: "staff"
      # Secrets: not stored in this file. Render will prompt for these in the
      # dashboard the first time this blueprint is applied.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: "claude-opus-5"

  - type: web
    name: vaers-client
    runtime: static
    buildCommand: npm install && npm run build --workspace=client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: "https://vaers-api.onrender.com"
